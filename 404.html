<!DOCTYPE html>
<html lang="pt-PT" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Não Encontrada | Raízes Literárias</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      background: var(--marfim);
    }
    .error-content h1 {
      font-size: 8rem;
      color: var(--terracotta);
      line-height: 1;
      margin-bottom: 10px;
    }
    .error-content h2 {
      font-size: 1.8rem;
      color: var(--verde);
      margin-bottom: 15px;
    }
    .error-content p {
      color: var(--cinza);
      font-size: 1.1rem;
      margin-bottom: 30px;
      max-width: 500px;
    }
    .error-actions {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .error-links {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid var(--marfim-dark);
    }
    .error-links h3 {
      color: var(--verde);
      margin-bottom: 15px;
    }
    .error-links-grid {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .error-links-grid a {
      padding: 10px 20px;
      background: var(--branco);
      border-radius: var(--radius-sm);
      color: var(--preto);
      transition: var(--transition);
      box-shadow: var(--sombra);
    }
    .error-links-grid a:hover {
      transform: translateY(-3px);
      box-shadow: var(--sombra-hover);
      color: var(--terracotta);
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-content">
      <h1>404</h1>
      <h2>Página Não Encontrada</h2>
      <p>Ops! A página que procura não existe ou foi movida. Que tal explorar nossa literatura?</p>
      <div class="error-actions">
        <a href="index.html" class="btn btn-primary">
          <i class="fas fa-home"></i> Voltar ao Início
        </a>
        <a href="paises.html" class="btn btn-secondary" style="border-color: var(--cinza-light); color: var(--preto);">
          <i class="fas fa-globe-africa"></i> Explorar Países
        </a>
      </div>
      <div class="error-links">
        <h3>Páginas Populares</h3>
        <div class="error-links-grid">
          <a href="index.html"><i class="fas fa-home"></i> Início</a>
          <a href="paises.html"><i class="fas fa-globe-africa"></i> Países</a>
          <a href="comunidade.html"><i class="fas fa-users"></i> Comunidade</a>
          <a href="entrevistas.html"><i class="fab fa-youtube"></i> Entrevistas</a>
          <a href="loja.html"><i class="fas fa-shopping-bag"></i> Loja</a>
          <a href="contato.html"><i class="fas fa-envelope"></i> Contato</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Redirecionar automaticamente após 30 segundos
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 30000);
  </script>
</body>
</html>
